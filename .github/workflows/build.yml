name: Build

on:
  push:
    branches:
      - master
      - main
      - kids

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - run: chmod +x gradlew

      - run: ./gradlew clean test UAFlixProvider:make makePluginsJson
